<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Jobs</title>
  <link rel="canonical" href="https://kyberlabs.ai/jobs">
</head>
<body>
  <section data-ux="Section">
    <div data-ux="SectionContainer">
      <div data-ux="Grid">
        <div data-ux="GridCell">
          <div data-ux="Block">
            <h2 role="heading" aria-level="2" data-ux="HeadingMajor" data-aid="FLEX_HEADING">Mechanical Engineer</h2>
          </div>
          <div data-ux="Block">
            <div data-ux="Text" data-aid="FLEX_RICHTEXT" data-typography="BodyAlpha">
              <p style="margin:0"><span><strong>Brooklyn, NY </strong>| Full time, in person</span></p>
            </div>
          </div>
        </div>
        <div data-ux="GridCell">
          <div data-ux="Block">
            <a data-ux="ButtonPrimary" data-aid="FLEX_CTA_BTN" href="/mech">Apply</a>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section data-ux="Section">
    <div data-ux="SectionContainer">
      <div data-ux="Grid">
        <div data-ux="GridCell">
          <div data-ux="Block">
            <h2 role="heading" aria-level="2" data-ux="HeadingMajor" data-aid="FLEX_HEADING">Senior Electrical Engineer</h2>
          </div>
          <div data-ux="Block">
            <div data-ux="Text" data-aid="FLEX_RICHTEXT" data-typography="BodyAlpha">
              <p style="margin:0"><span><strong>Brooklyn, NY </strong>| Full time, remote</span></p>
            </div>
          </div>
        </div>
        <div data-ux="GridCell">
          <div data-ux="Block">
            <a data-ux="ButtonPrimary" data-aid="FLEX_CTA_BTN" href="https://external.example.com/apply">Apply</a>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section data-ux="Section">
    <div data-ux="SectionContainer">
      <h2 role="heading" aria-level="2" data-ux="HeadingMajor" data-aid="FLEX_HEADING">Open Positions</h2>
      <p>This section has no apply link and should be ignored.</p>
    </div>
  </section>
</body>
</html>
